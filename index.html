<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">

    .color-dot {

    .color-dot.active { transform: scale(1.2); border-color: #0f172a; }

    .gallery-grid {

    .gallery-grid img {

      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;

      padding: 6px 4px;
      border-bottom: 1px solid #f1f5f9;

      justify-content: space-between;

      background: #e0e7ff;

<script>
/**
 * ------------------------------------------------------------------
 * 1. ARCHITECTURE CORE: SUBSCRIPTION & LIFECYCLE MANAGER
 * ------------------------------------------------------------------
 * Voorkomt Firebase Memory Leaks. Elke database-listener wordt bij
 * herrender netjes gesloopt (.off()) via een Subscription Bucket.
 */
class SubscriptionManager {
  constructor() { this.subs = new Map(); }
  
  subscribe(key, ref, eventType, callback) {
    this.unsubscribe(key);
    ref.on(eventType, callback);
    this.subs.set(key, { ref, eventType, callback });
  }

  unsubscribe(key) {
    if (this.subs.has(key)) {
      const { ref, eventType, callback } = this.subs.get(key);
      ref.off(eventType, callback);
      this.subs.delete(key);
    }
  }

  clear() {
    this.subs.forEach(({ ref, eventType, callback }) => ref.off(eventType, callback));
    this.subs.clear();
  }
}

/**
 * ------------------------------------------------------------------
 * 2. PERFORMANCE & RETINA CANVAS ENGINE
 * ------------------------------------------------------------------
 * Tekent vloeiend op hoge resoluties en comprimeert vóór Firebase.
 */
class FastCanvas {
  static init(canvasEl, onChange) {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvasEl.getBoundingClientRect();
    
    // Pixel ratio scaling voor Retina displays
    canvasEl.width = rect.width * dpr;
    canvasEl.height = rect.height * dpr;
    const ctx = canvasEl.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 3;

    let drawing = false;
    let currentColor = '#0f172a';
    let lastX = 0, lastY = 0;

    const getPos = (e) => {
      const r = canvasEl.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - r.left, y: clientY - r.top };
    };

    const start = (e) => {
      e.preventDefault();
      drawing = true;
      const p = getPos(e);
      lastX = p.x; lastY = p.y;
    };

    const move = (e) => {
      if (!drawing) return;
      e.preventDefault();
      const p = getPos(e);
      ctx.strokeStyle = currentColor;
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      lastX = p.x; lastY = p.y;
    };

    const stop = () => { drawing = false; };

    canvasEl.addEventListener('mousedown', start);
    canvasEl.addEventListener('mousemove', move);
    window.addEventListener('mouseup', stop);

    canvasEl.addEventListener('touchstart', start, { passive: false });
    canvasEl.addEventListener('touchmove', move, { passive: false });
    canvasEl.addEventListener('touchend', stop);

    return {
      setColor: (c) => { currentColor = c; },
      clear: () => { ctx.clearRect(0, 0, rect.width, rect.height); },
      // Converteert & verkleint naar compacte JPEG (< 25KB) tegen database overhead
      exportOptimizedBlob: () => {
        const offscreen = document.createElement('canvas');
        offscreen.width = 320;
        offscreen.height = 160;
        const oCtx = offscreen.getContext('2d');
        oCtx.fillStyle = '#ffffff';
        oCtx.fillRect(0, 0, 320, 160);
        oCtx.drawImage(canvasEl, 0, 0, 320, 160);
        return offscreen.toDataURL('image/jpeg', 0.65);
      }
    };
  }
}

/**
 * ------------------------------------------------------------------
 * 3. WERKVOORBEELDEN REGISTRY (POLYMORMIC PLUGIN PATTERN)
 * ------------------------------------------------------------------
 * Alle 25 vormen pluggen hier uniform in. Geen gigantische spaghetti-switch!
 */
class ModuleRegistry {
  static plugins = {};

  static register(type, definition) {
    this.plugins[type] = definition;
  }

  static render(comp, isEdit) {
    const plugin = this.plugins[comp.type] || this.plugins['text_default'];
    return `
      <div class="module-item ${comp.active === false ? 'disabled' : ''}" id="mod-${comp.id}">
        <div class="module-meta">
          <div class="module-title">${escapeHtml(comp.title || plugin.label)}</div>
          <div class="module-prompt">${escapeHtml(comp.prompt || '')}</div>
        </div>
        <div class="module-body">${plugin.renderUI(comp)}</div>
      </div>
    `;
  }

  static mount(comp, subManager) {
    const plugin = this.plugins[comp.type] || this.plugins['text_default'];
    if (plugin.mount) plugin.mount(comp, subManager);
  }
}

// ---------- REGISTRATIE VAN DIVERSE ACTIVERENDE VORMEN ----------

// 1. Zweedse Methode
ModuleRegistry.register('zweedse', {
  label: '1. Zweedse Methode (💡, ❓, 🏹)',
  renderUI: (c) => `
    <div class="ui-row">
      <select id="sel-${c.id}" class="ui-select">
        <option value="💡 Inzicht">💡 Lampje (Nieuw inzicht)</option>
        <option value="❓ Moeite">❓ Vraagteken (Wat vind je lastig?)</option>
        <option value="🏹 Toepassing">🏹 Pijl (Wat ga je doen?)</option>
      </select>
      <input type="text" id="inp-${c.id}" class="ui-input" placeholder="Jouw reflectie...">
      <button class="btn btn-primary" onclick="Actions.submitStream('${c.id}', document.getElementById('sel-${c.id}').value)">Delen</button>
    </div>
    <div class="stream-feed" id="feed-${c.id}">Geen data.</div>
  `,
  mount: (c, sm) => setupStreamSubscription(c.id, sm)
});

// 2, 18, 22. Geeltjes Board (Universeel voor Stille Conversatie, Koffer & Prullenbak)
ModuleRegistry.register('sticky_wall', {
  label: 'Universele Sticky Wall (Geeltjes)',
  renderUI: (c) => `
    <div class="ui-row">
      <select id="col-${c.id}" class="ui-select">
        <option value="yellow">Geel</option>
        <option value="pink">Roze</option>
        <option value="blue">Blauw</option>
        <option value="green">Groen</option>
      </select>
      <input type="text" id="inp-${c.id}" class="ui-input" placeholder="Plak een gedachte..." maxlength="120">
      <button class="btn btn-primary" onclick="Actions.submitSticky('${c.id}')">Plakken</button>
    </div>
    <div class="geeltjes-wall" id="wall-${c.id}"></div>
  `,
  mount: (c, sm) => {
    sm.subscribe(`sticky_${c.id}`, db.ref(`live/${c.id}/stickies`), 'value', snap => {
      const container = document.getElementById(`wall-${c.id}`);
      if (!container) return;
      const data = snap.val() || {};
      container.innerHTML = Object.values(data).reverse().map(s => `
        <div class="geeltje ${s.color}">
          <div>${escapeHtml(s.text)}</div>
          <div class="author">~ ${escapeHtml(s.user)}</div>
        </div>
      `).join('');
    });
  }
});

// 6 & 17. High-Performance Canvas (Tijdlijn / Teken de Kern)
ModuleRegistry.register('canvas_draw', {
  label: 'Teken de Kern (Digital Canvas)',
  renderUI: (c) => `
    <div class="canvas-container">
      <canvas id="cv-${c.id}" class="responsive-canvas"></canvas>
      <div class="palette-bar">
        <div class="color-dot active" style="background:#0f172a;" onclick="CanvasPool.setColor('${c.id}', '#0f172a', this)"></div>
        <div class="color-dot" style="background:#ef4444;" onclick="CanvasPool.setColor('${c.id}', '#ef4444', this)"></div>
        <div class="color-dot" style="background:#3b82f6;" onclick="CanvasPool.setColor('${c.id}', '#3b82f6', this)"></div>
        <div class="color-dot" style="background:#10b981;" onclick="CanvasPool.setColor('${c.id}', '#10b981', this)"></div>
        <button class="btn btn-subtle" style="margin-left:auto;" onclick="CanvasPool.clear('${c.id}')">Wissen</button>
        <button class="btn btn-primary" onclick="Actions.submitCanvas('${c.id}')">Deel Tekening</button>
      </div>
      <div class="gallery-grid" id="gal-${c.id}"></div>
    </div>
  `,
  mount: (c, sm) => {
    const el = document.getElementById(`cv-${c.id}`);
    if (el) CanvasPool.instances[c.id] = FastCanvas.init(el);
    
    sm.subscribe(`gal_${c.id}`, db.ref(`live/${c.id}/drawings`), 'value', snap => {
      const gal = document.getElementById(`gal-${c.id}`);
      if (!gal) return;
      const data = snap.val() || {};
      gal.innerHTML = Object.values(data).reverse().map(d => `
        <div>
          <img src="${d.img}" loading="lazy">
          <div style="font-size:0.75rem; color:var(--text-muted); text-align:center;">${escapeHtml(d.user)}</div>
        </div>
      `).join('');
    });
  }
});

// 8. Over De Streep (Slider met Live Aggregate)
ModuleRegistry.register('spectrum', {
  label: 'Over de Streep (Spectrum)',
  renderUI: (c) => `
    <div style="margin-top:10px;">
      <input type="range" min="1" max="10" value="5" style="width:100%; cursor:pointer;" id="rng-${c.id}" 
        oninput="document.getElementById('lbl-${c.id}').innerText = 'Jouw keuze: ' + this.value">
      <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:var(--text-muted); margin-top:4px;">
        <span>Oneens</span><span id="lbl-${c.id}">Jouw keuze: 5</span><span>Eens</span>
      </div>
      <button class="btn btn-primary" style="margin-top:8px; width:100%;" onclick="Actions.submitSpectrum('${c.id}', document.getElementById('rng-${c.id}').value)">Stem Vastleggen</button>
      <div id="spec-result-${c.id}" style="margin-top:8px; font-size:0.88rem; font-weight:700;"></div>
    </div>
  `,
  mount: (c, sm) => {
    sm.subscribe(`spec_${c.id}`, db.ref(`live/${c.id}/spectrum`), 'value', snap => {
      const el = document.getElementById(`spec-result-${c.id}`);
      if (!el) return;
      const val = snap.val() || {};
      const votes = Object.values(val);
      if (!votes.length) return;
      const avg = (votes.reduce((a, b) => a + Number(b), 0) / votes.length).toFixed(1);
      el.innerHTML = `Groepsgemiddelde: <span style="color:var(--primary); font-size:1.1rem;">${avg}</span> / 10 (${votes.length} stemmen)`;
    });
  }
});

// Standaard Text Fallback
ModuleRegistry.register('text_default', {
  label: 'Informatief Tekstblok',
  renderUI: (c) => `<p style="line-height:1.6; white-space:pre-wrap;">${escapeHtml(c.text || '')}</p>`
});

function setupStreamSubscription(id, sm) {
  sm.subscribe(`stream_${id}`, db.ref(`live/${id}/stream`), 'value', snap => {
    const feed = document.getElementById(`feed-${id}`);
    if (!feed) return;
    const data = snap.val() || {};
    feed.innerHTML = Object.values(data).reverse().map(item => `
      <div class="stream-row">
        <span>${item.badge ? `<span class="stream-badge">${escapeHtml(item.badge)}</span>` : ''}<strong>${escapeHtml(item.user)}:</strong> ${escapeHtml(item.text)}</span>
        <span style="font-size:0.75rem; color:#94a3b8;">${new Date(item.ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
      </div>
    `).join('') || '<em>Nog geen inzendingen.</em>';
  });
}

/**
 * ------------------------------------------------------------------
 * 4. FIREBASE STATE & DISPATCH ACTIONS
 * ------------------------------------------------------------------
 */
const firebaseConfig = {
  apiKey: "AIzaSyCSoSYmzdcse87_E-p6K-DMn_NbQWFnPNU",
  authDomain: "huddlebijdebie26jan.firebaseapp.com",
  databaseURL: "https://huddlebijdebie26jan-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "huddlebijdebie26jan"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const subManager = new SubscriptionManager();

const Session = {
  user: localStorage.getItem('huddle_username') || '',
  setName: () => {
    const val = document.getElementById('usernameInput').value.trim();
    if (!val) return;
    localStorage.setItem('huddle_username', val);
    Session.user = val;
    document.getElementById('authDialog').style.display = 'none';
  }
};

const CanvasPool = {
  instances: {},
  setColor: (id, hex, el) => {
    if (CanvasPool.instances[id]) {
      CanvasPool.instances[id].setColor(hex);
      el.parentElement.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      el.classList.add('active');
    }
  },
  clear: (id) => CanvasPool.instances[id] && CanvasPool.instances[id].clear()
};

const Actions = {
  submitStream: (id, badge) => {
    const inp = document.getElementById(`inp-${id}`);
    if (!inp || !inp.value.trim()) return;
    db.ref(`live/${id}/stream`).push({ user: Session.user, text: inp.value.trim(), badge, ts: Date.now() });
    inp.value = '';
  },
  submitSticky: (id) => {
    const inp = document.getElementById(`inp-${id}`);
    const col = document.getElementById(`col-${id}`).value;
    if (!inp || !inp.value.trim()) return;
    db.ref(`live/${id}/stickies`).push({ user: Session.user, text: inp.value.trim(), color: col, ts: Date.now() });
    inp.value = '';
  },
  submitCanvas: (id) => {
    if (!CanvasPool.instances[id]) return;
    const base64 = CanvasPool.instances[id].exportOptimizedBlob();
    db.ref(`live/${id}/drawings`).push({ user: Session.user, img: base64, ts: Date.now() });
    CanvasPool.instances[id].clear();
  },
  submitSpectrum: (id, val) => {
    db.ref(`live/${id}/spectrum/${Session.user}`).set(val);
  }
};

/**
 * ------------------------------------------------------------------
 * 5. VIEW RENDER ENGINE
 * ------------------------------------------------------------------
 */
let isEditMode = new URLSearchParams(window.location.search).get('mode') === 'edit';

function renderApp(topics, content) {
  subManager.clear();
  const root = document.getElementById('topicContainer');
  root.innerHTML = '';

  topics.forEach(topic => {
    const card = document.createElement('div');
    card.className = 'topic-card';

    const items = content[topic.id] || [];
    const innerHtml = items.map(c => ModuleRegistry.render(c, isEditMode)).join('');

    card.innerHTML = `
      <button class="topic-header" onclick="this.nextElementSibling.classList.toggle('open')">
        <span>${escapeHtml(topic.title)}</span>
        <span style="color:var(--text-muted); font-size:0.8rem;">▼</span>
      </button>
      <div class="topic-content">
        ${innerHtml}
      </div>
    `;
    root.appendChild(card);

    // Activeer lifecycles
    items.forEach(c => ModuleRegistry.mount(c, subManager));
  });
}

// Bootstrap
window.addEventListener('DOMContentLoaded', () => {
  if (!Session.user) document.getElementById('authDialog').style.display = 'flex';
  
  const roleBadge = document.getElementById('roleBadge');
  const toggleBtn = document.getElementById('toggleRoleBtn');
  if (isEditMode) {
    roleBadge.textContent = 'Beheerder';
    roleBadge.className = 'badge-mode edit';
    toggleBtn.textContent = 'Volgmodus';
  }
  toggleBtn.onclick = () => window.location.search = isEditMode ? '' : '?mode=edit';

  const node = isEditMode ? 'draft' : 'published';
  db.ref(node).on('value', snap => {
    const val = snap.val();
    if (val && val.topics) renderApp(val.topics, val.content || {});
  });
});

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
</script>
