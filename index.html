        db.ref(dataNode).set(defaultData);
        data = defaultData;
      }
      renderAllComponents();
      loadAllFeeds();

  // ---------- RENDER CONTENT ----------
  function assignImage(topicId, compId, userName) {
    return new Promise((resolve, reject) => {
      const ref = db.ref(`fotoToewijzing/${topicId}/${compId}`);
      ref.transaction((currentData) => {
        if (currentData === null) {
          return { assigned: {}, available: allImages.slice() };
        }
        if (currentData.assigned && currentData.assigned[userName]) {
          return;
        }
        if (!currentData.available || currentData.available.length === 0) {
          return;
        }
        const image = currentData.available[0];
        const newAvailable = currentData.available.slice(1);
        const newAssigned = currentData.assigned || {};
        newAssigned[userName] = image;
        return { assigned: newAssigned, available: newAvailable };
      }, (error, committed, snapshot) => {
        if (error) reject(error);
        else if (committed) {
          const data = snapshot.val();
          if (data && data.assigned && data.assigned[userName]) {
            resolve(data.assigned[userName]);
          } else if (!data.available || data.available.length === 0) {
            resolve(null);
          } else {
            resolve(null);
          }
        } else {
          reject(new Error('Transactie mislukt'));
        }
      });
    });
  }

      case 'vraag':
        container.innerHTML = `
          <div><strong>${escapeHtml(comp.vraagText || 'Stel een vraag...')}</strong>
            <div class="vraag-input"><input type="text" id="antwoord-input-${comp.id}" placeholder="Uw antwoord..."><button onclick="verzendAntwoord('${topicId}','${comp.id}')">Verzend</button></div>
            <div class="antwoord-lijst" id="antwoord-lijst-${comp.id}"><em>Antwoorden worden geladen...</em></div>
          </div>
        `;
        listenToAnswers(topicId, comp.id);
        break;
      case 'foto-opdracht':
        const fotoDiv = document.createElement('div');
        fotoDiv.innerHTML = `
          <h4 style="margin-bottom:8px;">📸 Kaarten op tafel</h4>
          <div id="foto-area-${comp.id}"><p>Bezig met laden van uw foto...</p></div>
          <div class="foto-input">
            <select id="foto-keuze-${comp.id}" style="padding:8px;border:1px solid #ccc;border-radius:6px;">
              <option value="ja">✅ Past bij mij</option>
              <option value="nee">❌ Past niet bij mij</option>
            </select>
            <textarea id="foto-reason-${comp.id}" rows="2" placeholder="Waarom? Leg uit..." style="flex:1;padding:8px;border:1px solid #ccc;border-radius:6px;"></textarea>
            <button onclick="verzendFotoOpdracht('${topicId}','${comp.id}')">Verstuur</button>
          </div>
          <div class="foto-lijst" id="foto-lijst-${comp.id}"><em>Reacties worden geladen...</em></div>
        `;
        container.appendChild(fotoDiv);
        assignImage(topicId, comp.id, currentUserName).then(imageUrl => {
          const area = document.getElementById(`foto-area-${comp.id}`);
          if (imageUrl) {
            area.innerHTML = `<img src="${imageUrl}" class="foto-opdracht-img" alt="Toegewezen foto">`;
            currentImageMap[comp.id] = imageUrl;
          } else {
            area.innerHTML = `<p style="color:red;">Geen beschikbare foto's meer. Neem contact op met de begeleider.</p>`;
          }
        }).catch(err => {
          console.error('Fout bij toewijzen foto:', err);
          const area = document.getElementById(`foto-area-${comp.id}`);
          area.innerHTML = `<p style="color:red;">Fout bij het laden van de foto.</p>`;
        });
        listenToFotoOpdrachten(topicId, comp.id);
        break;
      case 'tekenbord':
        container.innerHTML = `<div class="tekenbord-container"><canvas id="canvas-${comp.id}" width="600" height="400"></canvas><div class="tekenknoppen"><button onclick="clearDrawing('${topicId}','${comp.id}')">🗑️ Wissen</button><button onclick="saveDrawing('${topicId}','${comp.id}')">💾 Opslaan</button></div></div>`;
        setTimeout(() => initDrawing(topicId, comp.id), 100);
        break;
      case 'gebedspunten':
        container.innerHTML = `<div class="gebedspunten-container"><div class="input-row"><input type="text" id="gebedspunt-input-${comp.id}" placeholder="Voeg een gebedspunt toe..."><button onclick="voegGebedspuntToe('${topicId}','${comp.id}')">➕ Toevoegen</button></div><div class="gebedspunten-lijst" id="gebedspunten-lijst-${comp.id}"><em>Gebedspunten worden geladen...</em></div></div>`;
        listenToGebedspunten(topicId, comp.id);
        break;
      case 'bijbeltekst':
        const ref = comp.reference || ''; 
        const version = comp.version || '193';
        const embedUrl = ref ? `https://www.bible.com/nl/bible/${version}/${encodeURIComponent(ref)}` : '';
        container.innerHTML = `<div class="bijbeltekst-container">
            <div class="input-row">
              <input type="text" id="bijbel-ref-${comp.id}" placeholder="Bijbelreferentie (bv. Johannes 3:16)" value="${escapeHtml(ref)}">
              <input type="text" id="bijbel-version-${comp.id}" placeholder="Versie (bv. 193)" value="${escapeHtml(version)}" style="max-width:100px;">
              <button onclick="updateBijbeltekst('${topicId}','${comp.id}')">Update</button>
            </div>
            ${embedUrl ? `<iframe src="${embedUrl}" allowfullscreen style="width:100%;height:400px;border:none;border-radius:8px;"></iframe>` : '<p>Voer een Bijbelreferentie in en klik op Update.</p>'}
          </div>`;
        break;
      default: container.textContent = 'Onbekend type';
    }
  }

  // ---------- TOGGLE (alleen in edit) ----------
  function toggleComponent(topicId, index) {
    if (!isEditMode) return;
    const comp = data[topicId][index]; if (!comp) return;
    comp.active = comp.active !== false ? false : true;
    // Update in draft (we zitten in edit-modus)
    db.ref(`draft/${topicId}/${index}`).update({ active: comp.active });
  }

  // ---------- LIVE FEEDS ----------
  function listenToAnswers(topicId, compId) {
    db.ref(`answers/${topicId}/${compId}`).on('value', (sn) => {
      const val = sn.val(); const el = document.getElementById(`antwoord-lijst-${compId}`);
      if (!el) return;
      if (!val) { el.innerHTML = '<em>Nog geen antwoorden.</em>'; return; }
      let html = ''; Object.keys(val).sort((a,b)=>a-b).forEach(k => {
        html += `<div class="antwoord-item">${escapeHtml(val[k].antwoord)} <span class="tijd">${new Date(val[k].timestamp).toLocaleString()}</span></div>`;
      }); el.innerHTML = html;
    });
  }
  function verzendAntwoord(topicId, compId) {
    const input = document.getElementById(`antwoord-input-${compId}`); if (!input) return;
    const txt = input.value.trim(); if (!txt) { alert('Voer een antwoord in.'); return; }
    db.ref(`answers/${topicId}/${compId}`).push({ antwoord: txt, timestamp: Date.now() });
    input.value = '';
  }

  function listenToGebedspunten(topicId, compId) {
    db.ref(`gebedspunten/${topicId}/${compId}`).on('value', (sn) => {
      const val = sn.val(); const el = document.getElementById(`gebedspunten-lijst-${compId}`);
      if (!el) return;
      if (!val) { el.innerHTML = '<em>Nog geen gebedspunten.</em>'; return; }
      let html = ''; Object.keys(val).sort((a,b)=>a-b).forEach(k => {
        html += `<div class="gebedspunt-item">${escapeHtml(val[k].punt)} <span class="tijd">${new Date(val[k].timestamp).toLocaleString()}</span></div>`;
      }); el.innerHTML = html;
    });
  }
  function voegGebedspuntToe(topicId, compId) {
    const input = document.getElementById(`gebedspunt-input-${compId}`); if (!input) return;
    const txt = input.value.trim(); if (!txt) { alert('Voer een gebedspunt in.'); return; }
    db.ref(`gebedspunten/${topicId}/${compId}`).push({ punt: txt, timestamp: Date.now() });
    input.value = '';
  }

  // ---------- FOTO-OPDRACHT FEED ----------
  function listenToFotoOpdrachten(topicId, compId) {
    db.ref(`fotoOpdrachten/${topicId}/${compId}`).on('value', (sn) => {
      const val = sn.val(); const el = document.getElementById(`foto-lijst-${compId}`);
      if (!el) return;
      if (!val) { el.innerHTML = '<em>Nog geen reacties.</em>'; return; }
      let html = ''; Object.keys(val).sort((a,b)=>a-b).forEach(k => {
        const item = val[k];
        const keuzeText = item.keuze === 'ja' ? '✅ Past bij mij' : '❌ Past niet bij mij';
        html += `<div class="foto-item">
          <img src="${item.imageUrl}" alt="Foto">
          <span class="naam">${escapeHtml(item.naam)}</span>
          <span class="keuze">${keuzeText}</span>
          <span>— ${escapeHtml(item.reason)}</span>
          <span class="tijd">${new Date(item.timestamp).toLocaleString()}</span>
        </div>`;
      }); el.innerHTML = html;
    });
  }
  function verzendFotoOpdracht(topicId, compId) {
    if (!currentUserName) { alert('Je moet je naam invoeren!'); return; }
    const keuzeEl = document.getElementById(`foto-keuze-${compId}`);
    const reasonEl = document.getElementById(`foto-reason-${compId}`);
    if (!keuzeEl || !reasonEl) return;
    const keuze = keuzeEl.value; const reason = reasonEl.value.trim();
    if (!reason) { alert('Schrijf waarom deze foto bij je past of niet.'); return; }
    const imageUrl = currentImageMap[compId];
    if (!imageUrl) { alert('Er is nog geen foto geladen.'); return; }
    db.ref(`fotoOpdrachten/${topicId}/${compId}`).push({
      naam: currentUserName,
      keuze: keuze,
      reason: reason,
      imageUrl: imageUrl,
      timestamp: Date.now()
    });
    reasonEl.value = '';
  }

  // ---------- TEKENBORD ----------
  let drawingState = {};
  function initDrawing(topicId, compId) {
    const canvas = document.getElementById(`canvas-${compId}`); if (!canvas) return;
    const ctx = canvas.getContext('2d'); const key = `${topicId}-${compId}`; drawingState[key] = { canvas, ctx, isDrawing: false };
    db.ref(`drawings/${topicId}/${compId}`).once('value').then(sn => {
      const dataUrl = sn.val(); if (dataUrl) { const img = new Image(); img.onload = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0); }; img.src = dataUrl; }
    });
    const startDraw = (x, y) => { ctx.beginPath(); ctx.moveTo(x, y); drawingState[key].isDrawing = true; };
    const moveDraw = (x, y) => { if (!drawingState[key].isDrawing) return; ctx.lineTo(x, y); ctx.stroke(); };
    const endDraw = () => { drawingState[key].isDrawing = false; saveDrawing(topicId, compId); };
    canvas.addEventListener('mousedown', (e) => { const r = canvas.getBoundingClientRect(); startDraw((e.clientX-r.left)*(canvas.width/r.width), (e.clientY-r.top)*(canvas.height/r.height)); });
    canvas.addEventListener('mousemove', (e) => { if (!drawingState[key].isDrawing) return; const r = canvas.getBoundingClientRect(); moveDraw((e.clientX-r.left)*(canvas.width/r.width), (e.clientY-r.top)*(canvas.height/r.height)); });
    canvas.addEventListener('mouseup', endDraw); canvas.addEventListener('mouseleave', endDraw);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); const t = e.touches[0]; const r = canvas.getBoundingClientRect(); startDraw((t.clientX-r.left)*(canvas.width/r.width), (t.clientY-r.top)*(canvas.height/r.height)); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if (!drawingState[key].isDrawing) return; const t = e.touches[0]; const r = canvas.getBoundingClientRect(); moveDraw((t.clientX-r.left)*(canvas.width/r.width), (t.clientY-r.top)*(canvas.height/r.height)); });
    canvas.addEventListener('touchend', endDraw);
  }
  function saveDrawing(topicId, compId) { const key = `${topicId}-${compId}`; const state = drawingState[key]; if (!state) return; db.ref(`drawings/${topicId}/${compId}`).set(state.canvas.toDataURL('image/png')); }
  function clearDrawing(topicId, compId) { const key = `${topicId}-${compId}`; const state = drawingState[key]; if (!state) return; state.ctx.clearRect(0, 0, state.canvas.width, state.canvas.height); db.ref(`drawings/${topicId}/${compId}`).remove(); }

  function loadAllFeeds() { /* done by listeners */ }

  // ---------- BIJBELTEKST ----------
  function updateBijbeltekst(topicId, compId) {
    const refInput = document.getElementById(`bijbel-ref-${compId}`); const versionInput = document.getElementById(`bijbel-version-${compId}`);
    if (!refInput || !versionInput) return;
    const ref = refInput.value.trim(); const version = versionInput.value.trim() || '193';
    const comp = data[topicId].find(c => c.id === compId); if (comp) { comp.reference = ref; comp.version = version; 
      // Update in draft (we zitten in edit-modus)
      const index = data[topicId].indexOf(comp);
      if (index !== -1) db.ref(`draft/${topicId}/${index}`).update({ reference: ref, version: version });
    }
  }

  // ---------- MODAL FUNCTIONS (alleen in edit) ----------
  function openAddModal(topicId) {
    if (!isEditMode) return;
    currentTopicId = topicId; currentComponentId = null; modalMode = 'add'; 
    const type = document.getElementById(`type-select-${topicId}`).value; 
    openModalForType(type, null);
  }
  function openEditModal(topicId, index) {
    if (!isEditMode) return;
    currentTopicId = topicId; currentComponentId = index; modalMode = 'edit'; 
    const comp = data[topicId][index]; if (!comp) return; 
    openModalForType(comp.type, comp);
  }
  
  let currentTopicId = null, currentComponentId = null, modalMode = 'add';

  function openModalForType(type, existing) {
    const overlay = document.getElementById('modal-overlay'); const title = document.getElementById('modal-title'); const form = document.getElementById('modal-form');
    title.textContent = modalMode === 'add' ? `Voeg ${componentTypes.find(t=>t.value===type)?.label || type} toe` : 'Bewerk component';
    let html = `<input type="hidden" id="modal-type" value="${type}">`;
    switch(type) {
      case 'text': html += `<label>Tekstinhoud</label><textarea id="modal-text" rows="4">${existing ? existing.text || '' : ''}</textarea>`; break;
      case 'youtube': html += `<label>YouTube Video-ID</label><input id="modal-videoId" value="${existing ? existing.videoId || '' : ''}" placeholder="Bijv. dQw4w9WgXcQ">`; break;
      case 'vraag': html += `<label>Vraagtekst</label><textarea id="modal-vraagText" rows="2">${existing ? existing.vraagText || '' : ''}</textarea>`; break;
      case 'foto-opdracht': html += `<p>Geen instellingen nodig. De foto wordt willekeurig toegewezen uit de lokale screenshots.</p>`; break;
      case 'tekenbord': html += `<p>Geen instellingen.</p>`; break;
      case 'gebedspunten': html += `<p>Geen instellingen.</p>`; break;
      case 'bijbeltekst': html += `<label>Bijbelreferentie</label><input id="modal-reference" value="${existing ? existing.reference || '' : ''}"><label>Versie (bv. 193)</label><input id="modal-version" value="${existing ? existing.version || '' : '193'}">`; break;
      default: html += `<p>Onbekend type</p>`;
    }
    html += `<label><input type="checkbox" id="modal-active" ${existing && existing.active === false ? '' : 'checked'}> Component actief</label>`;
    form.innerHTML = html; overlay.style.display = 'flex';
  }
  function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
  function saveModal() {
    if (!isEditMode) return;
    const type = document.getElementById('modal-type').value; let newComp = { type };
    switch(type) {
      case 'text': newComp.text = document.getElementById('modal-text').value; break;
      case 'youtube': newComp.videoId = document.getElementById('modal-videoId').value; break;
      case 'vraag': newComp.vraagText = document.getElementById('modal-vraagText').value; break;
      case 'foto-opdracht': break;
      case 'tekenbord': newComp.drawing = ''; break;
      case 'gebedspunten': break;
      case 'bijbeltekst': newComp.reference = document.getElementById('modal-reference').value; newComp.version = document.getElementById('modal-version').value || '193'; break;
      default: newComp = { type };
    }
    newComp.active = document.getElementById('modal-active').checked;
    if (!newComp.id) newComp.id = 'comp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
    const topicId = currentTopicId; const list = data[topicId] || [];
    if (modalMode === 'add') list.push(newComp); else { const idx = currentComponentId; if (idx !== null && idx < list.length) { newComp.id = list[idx].id; list[idx] = newComp; } }
    data[topicId] = list; 
    // Update draft
    db.ref(`draft/${topicId}`).set(list);
    closeModal();
  }

  function deleteComponent(topicId, index) {
    if (!isEditMode) return;
    if (!confirm('Weet je zeker dat je dit component wilt verwijderen?')) return;
    const list = data[topicId] || []; const comp = list[index];
    if (comp) { 
      if (comp.type === 'vraag') db.ref(`answers/${topicId}/${comp.id}`).remove(); 
      if (comp.type === 'foto-opdracht') db.ref(`fotoOpdrachten/${topicId}/${comp.id}`).remove(); 
      if (comp.type === 'tekenbord') db.ref(`drawings/${topicId}/${comp.id}`).remove(); 
      if (comp.type === 'gebedspunten') db.ref(`gebedspunten/${topicId}/${comp.id}`).remove(); 
    }
    list.splice(index, 1); 
    data[topicId] = list;
    db.ref(`draft/${topicId}`).set(list);
  }

  // ---------- PUBLICATIE ----------
  document.getElementById('publishBtn').addEventListener('click', function() {
    if (!isEditMode) return;
    if (!confirm('Weet je zeker dat je de huidige draft wilt publiceren naar de studenten?')) return;
    // Kopieer draft naar published
    db.ref('draft').once('value').then(snapshot => {
      const draftData = snapshot.val();
      if (draftData) {
        db.ref('published').set(draftData);
        alert('✅ Gepubliceerd! Studenten zien nu de bijgewerkte versie.');
      } else {
        alert('Er is geen draft om te publiceren.');
      }
    });
  });

  // ---------- RESET ----------
  document.getElementById('resetBtn').addEventListener('click', function() {
    if (!isEditMode) return;
    if (!confirm('Weet je zeker dat je ALLE gegevens wilt wissen? Dit verwijdert alle antwoorden, tekeningen, gebedspunten, foto-reacties, foto-toewijzingen, én de draft en published inhoud. De standaardteksten worden hersteld.')) return;
    // Wis alle interactiedata
    db.ref('answers').remove();
    db.ref('drawings').remove();
    db.ref('gebedspunten').remove();
    db.ref('fotoOpdrachten').remove();
    db.ref('fotoToewijzing').remove();
    // Reset draft en published naar default
    const defaultData = getDefaultData();
    db.ref('draft').set(defaultData);
    db.ref('published').set(defaultData);
  });

  // ---------- INIT ----------
  document.addEventListener('DOMContentLoaded', renderAccordion);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  function escapeHtml(text) { if (!text) return ''; const map = { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }; return text.replace(/[&<>"']/g, m => map[m]); }
</script>
</body>
</html>
