  // Wijs een willekeurige, nog niet gebruikte foto toe aan de huidige gebruiker
  function assignRandomPhoto() {
    if (!currentUserName) return;
    const userRef = db.ref('fototoewijzing/' + currentUserName);
    userRef.once('value', (snap) => {
      if (snap.exists()) return; // al een foto
      // Haal alle bestaande toewijzingen op om een vrije foto te kiezen
      db.ref('fototoewijzing').once('value', (allSnap) => {
        const existing = allSnap.val() || {};
        const usedIndices = Object.values(existing).map(v => v.index);
        const freeIndices = SCREENSHOTS.map((_, i) => i).filter(i => !usedIndices.includes(i));
        if (freeIndices.length === 0) {
          // Alle foto's bezet – kies gewoon een willekeurige (overlap toestaan)
          const randomIndex = Math.floor(Math.random() * SCREENSHOTS.length);
          userRef.set({ index: randomIndex, foto: SCREENSHOTS[randomIndex] });
        } else {
          const randomIndex = freeIndices[Math.floor(Math.random() * freeIndices.length)];
          userRef.set({ index: randomIndex, foto: SCREENSHOTS[randomIndex] });
        }
      });
    });
  }

  // ---------- STATE ----------
  let topicsList = [];
  let contentData = {};
  let currentTopicId = null;
  let currentComponentIdx = null;
  let modalMode = 'add';

  // ---------- ACCORDEON & RENDER CORE ----------
  function initApp() {
    const dataNode = isEditMode ? 'draft' : 'published';
    db.ref(dataNode).on('value', (snapshot) => {
      const val = snapshot.val();
      if (val) {
        topicsList = val.topics || [];
        contentData = val.content || {};
      } else {
        const def = getDefaultData();
        topicsList = def.topics;
        contentData = def.content;
        db.ref(dataNode).set(def);
      }
      renderAccordionStructure();
    });
  }

  function renderAccordionStructure() {
    const root = document.getElementById('accordion-root');
    root.innerHTML = '';
    
    topicsList.forEach(topic => {
      const item = document.createElement('div'); item.className = 'accordion-item';
      
      const header = document.createElement('button'); header.className = 'accordion-header';
      header.innerHTML = `<span>${escapeHtml(topic.title)}</span> <span class="arrow">▶</span>`;
      header.onclick = (e) => {
        if(e.target.tagName !== 'BUTTON' && e.target.closest('.topic-controls')) return;
        toggleAccordion(header, topic.id);
      };

      const panel = document.createElement('div'); panel.className = 'accordion-panel'; panel.id = `panel-${topic.id}`;
      
      if (isEditMode) {
        const tControls = document.createElement('div');
        tControls.className = 'topic-controls';
        tControls.innerHTML = `
          <button class="btn-edit-topic" onclick="openEditTopicModal('${topic.id}', '${escapeHtml(topic.title)}')">✎ Titel Aanpassen</button>
          <button class="btn-delete-topic" onclick="deleteTopic('${topic.id}')">🗑️ Avond Verwijderen</button>
        `;
        panel.appendChild(tControls);
      }

      const compContainer = document.createElement('div'); 
      compContainer.className = 'component-container'; 
      compContainer.id = `components-${topic.id}`; 
      panel.appendChild(compContainer);
      
      if (isEditMode) {
        const addArea = document.createElement('div'); addArea.className = 'add-component-area';
        addArea.innerHTML = `
          <select id="type-select-${topic.id}">
            <option value="text">Tekstblok</option>
            <option value="vraag">Open Vraag</option>
            <option value="stelling">Stelling (Poll)</option>
            <option value="fotoStelling">Foto-stelling (Screenshots)</option>
            <option value="website">Website (iframe)</option>
            <option value="youtube">YouTube-video</option>
          </select>
          <button onclick="openAddModal('${topic.id}')">➕ Blok Toevoegen</button>
        `;
        panel.appendChild(addArea);
      }
      
      item.appendChild(header); item.appendChild(panel); root.appendChild(item);
      renderComponents(topic.id);
    });
  }

  function toggleAccordion(header, topicId) {
    const panel = document.getElementById(`panel-${topicId}`);
    const isOpen = panel.classList.contains('open');
    if (isOpen) {
      panel.classList.remove('open'); header.classList.remove('active');
    } else {
      panel.classList.add('open'); header.classList.add('active');
    }
  }

  function renderComponents(topicId) {
    setTimeout(() => {
      const container = document.getElementById(`components-${topicId}`);
      if (!container) return;
      container.innerHTML = '';
      
      const list = contentData[topicId] || [];
      list.forEach((comp, idx) => {
        if (!isEditMode && comp.active === false) return;

        const box = document.createElement('div');
        box.className = 'component-item' + (comp.active === false ? ' disabled' : '');
        
        let innerHTML = '';
        if (comp.type === 'text') {
          innerHTML = `<p style="white-space:pre-wrap;">${escapeHtml(comp.text)}</p>`;
        } else if (comp.type === 'vraag') {
          innerHTML = `
            <div class="vraag-box">
              <strong>❓ Vraag: ${escapeHtml(comp.vraagText)}</strong>
              <div class="input-group">
                <input type="text" id="in-${comp.id}" placeholder="Typ jouw antwoord...">
                <button onclick="sendAnswer('${topicId}','${comp.id}')">Verstuur</button>
              </div>
              <div class="feed-container" id="feed-${comp.id}">Bezig met antwoorden laden...</div>
            </div>`;
          listenToAnswers(topicId, comp.id);
        } else if (comp.type === 'stelling') {
          innerHTML = `
            <div class="stelling-box">
              <strong>📊 Stelling: "${escapeHtml(comp.stellingText)}"</strong>
              <div class="poll-buttons">
                <button class="btn-poll eens" onclick="votePoll('${topicId}','${comp.id}','Eens')">👍 Eens</button>
                <button class="btn-poll oneens" onclick="votePoll('${topicId}','${comp.id}','Oneens')">👎 Oneens</button>
              </div>
              <div class="poll-results" id="poll-res-${comp.id}">Uitslag: 0x Eens | 0x Oneens</div>
            </div>`;
          listenToPoll(topicId, comp.id);
        } else if (comp.type === 'fotoStelling') {
          // Foto-stelling: toont grid met alle screenshots en live toewijzingen
          innerHTML = `
            <div class="foto-stelling-box">
              <strong>📷 Foto-stelling: ${escapeHtml(comp.stellingText)}</strong>
              <div class="foto-grid" id="foto-grid-${comp.id}"></div>
              <div class="feed-container" id="foto-feed-${comp.id}">Bezig met reacties laden...</div>
            </div>`;
          // Start listeners voor toewijzingen en reacties
          listenToPhotoAssignments(comp.id);
          listenToPhotoReactions(topicId, comp.id);
        } else if (comp.type === 'website') {
          innerHTML = `
            <div class="label">🌐 Website:</div>
            <div class="iframe-container">
              <iframe src="${escapeHtml(comp.url)}" allowfullscreen></iframe>
            </div>`;
        } else if (comp.type === 'youtube') {
          const videoId = extractYouTubeId(comp.url);
          innerHTML = `
            <div class="label">🎬 YouTube:</div>
            <div class="youtube-container">
              <iframe src="https://www.youtube.com/embed/${videoId}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>`;
        }

        box.innerHTML = innerHTML;

        if (isEditMode) {
          const actions = document.createElement('div'); actions.className = 'actions';
          const toggleBtn = document.createElement('button'); 
          toggleBtn.className = 'toggle' + (comp.active !== false ? ' on' : ''); 
          toggleBtn.textContent = comp.active !== false ? 'Zichtbaar' : 'Verborgen'; 
          toggleBtn.onclick = () => toggleComponent(topicId, idx);
          
          const editBtn = document.createElement('button'); editBtn.textContent = '✎ Edit'; editBtn.onclick = () => openEditModal(topicId, idx);
          const delBtn = document.createElement('button'); delBtn.textContent = '✕ Wis'; delBtn.className = 'delete'; delBtn.onclick = () => deleteComponent(topicId, idx);
          
          actions.appendChild(toggleBtn); actions.appendChild(editBtn); actions.appendChild(delBtn);
          box.appendChild(actions);
        }

        container.appendChild(box);
      });
    }, 50);
  }

  // ---------- FOTO-STELLING: TOEWIJZINGEN & REACTIES ----------
  function listenToPhotoAssignments(compId) {
    const gridContainer = document.getElementById(`foto-grid-${compId}`);
    if (!gridContainer) return;
    db.ref('fototoewijzing').on('value', (snap) => {
      const assignments = snap.val() || {};
      gridContainer.innerHTML = '';
      // Toon alle foto's uit de lijst (niet alleen toegewezen)
      SCREENSHOTS.forEach((foto, index) => {
        const owners = Object.keys(assignments).filter(name => assignments[name].index === index);
        const ownerName = owners.length > 0 ? owners.join(', ') : 'Nog niet toegewezen';
        const isCurrentUserOwner = owners.includes(currentUserName);
        const card = document.createElement('div');
        card.className = 'foto-card';
        card.innerHTML = `
          <img src="${foto}" alt="Screenshot ${index+1}">
          <div class="naam">${escapeHtml(ownerName)}</div>
          ${isCurrentUserOwner ? '<div class="eigenaar-badge">Jouw foto</div>' : ''}
        `;
        gridContainer.appendChild(card);
      });
    });
  }

  function listenToPhotoReactions(topicId, compId) {
    const feedContainer = document.getElementById(`foto-feed-${compId}`);
    if (!feedContainer) return;
    db.ref(`interactie/${topicId}/${compId}/reacties`).on('value', (snap) => {
      feedContainer.innerHTML = '';
      const data = snap.val();
      if (!data) { feedContainer.innerHTML = '<em>Nog geen reacties.</em>'; return; }
      Object.values(data).reverse().forEach(r => {
        feedContainer.innerHTML += `<div class="feed-item"><span><strong>${escapeHtml(r.naam)}:</strong> ${escapeHtml(r.reactie)}</span><span class="time">${new Date(r.ts).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span></div>`;
      });
    });
  }

  // Functie voor het versturen van een reactie bij de foto-stelling
  function sendPhotoReaction(topicId, compId, reactie) {
    if (!currentUserName) return;
    db.ref(`interactie/${topicId}/${compId}/reacties`).push({
      naam: currentUserName,
      reactie: reactie,
      ts: Date.now()
    });
  }

  // Knoppen in foto-stelling: klik op "Past bij mij" of "Past niet bij mij"
  function photoReact(topicId, compId, soort) {
    const reactie = soort === 'wel' ? '👍 Deze foto past bij mij' : '👎 Deze foto past niet bij mij';
    sendPhotoReaction(topicId, compId, reactie);
  }

  // ---------- INTERACTIE LIVE FEEDS (bestaande) ----------
  function sendAnswer(topicId, compId) {
    const input = document.getElementById(`in-${compId}`);
    if (!input || !input.value.trim()) return;
    db.ref(`interactie/${topicId}/${compId}/antwoorden`).push({
      naam: currentUserName || "Anoniem",
      txt: input.value.trim(),
      ts: Date.now()
    });
    input.value = '';
  }

  function listenToAnswers(topicId, compId) {
    db.ref(`interactie/${topicId}/${compId}/antwoorden`).on('value', (snap) => {
      const container = document.getElementById(`feed-${compId}`);
      if (!container) return;
      container.innerHTML = '';
      const data = snap.val();
      if (!data) { container.innerHTML = '<em>Nog geen antwoorden ingestuurd.</em>'; return; }
      Object.values(data).reverse().forEach(a => {
        container.innerHTML += `<div class="feed-item"><span><strong>${escapeHtml(a.naam)}:</strong> ${escapeHtml(a.txt)}</span><span class="time">${new Date(a.ts).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span></div>`;
      });
    });
  }

  function votePoll(topicId, compId, vote) {
    if(!currentUserName) return;
    db.ref(`interactie/${topicId}/${compId}/poll/${currentUserName}`).set(vote);
  }

  function listenToPoll(topicId, compId) {
    db.ref(`interactie/${topicId}/${compId}/poll`).on('value', (snap) => {
      const display = document.getElementById(`poll-res-${compId}`);
      if (!display) return;
      const data = snap.val();
      if(!data) { display.textContent = "Uitslag: 0x Eens | 0x Oneens"; return; }
      let eens = 0, oneens = 0;
      Object.values(data).forEach(v => { if(v === 'Eens') eens++; else oneens++; });
      display.textContent = `Uitslag live: ${eens}x Eens 👍 | ${oneens}x Oneens 👎`;
    });
  }

  // ---------- EDIT EN EDIT-MODALS (DRAFT) ----------
  function toggleComponent(topicId, idx) {
    const comp = contentData[topicId][idx];
    comp.active = !comp.active;
    db.ref(`draft/content/${topicId}/${idx}/active`).set(comp.active);
  }

  function openAddModal(topicId) {
    currentTopicId = topicId; modalMode = 'add';
    const type = document.getElementById(`type-select-${topicId}`).value;
    buildModalForm(type, null);
  }

  function openEditModal(topicId, idx) {
    currentTopicId = topicId; currentComponentIdx = idx; modalMode = 'edit';
    const comp = contentData[topicId][idx];
    buildModalForm(comp.type, comp);
  }

  function buildModalForm(type, existing) {
    const form = document.getElementById('modal-form');
    document.getElementById('modal-title').textContent = modalMode === 'add' ? "Component Toevoegen" : "Component Redigeren";
    form.innerHTML = `<input type="hidden" id="m-type" value="${type}">`;
    
    if (type === 'text') {
      form.innerHTML += `<label>Inhoud tekstblok</label><textarea id="m-text" rows="6">${existing ? existing.text : ''}</textarea>`;
    } else if (type === 'vraag') {
      form.innerHTML += `<label>Vraagtekst</label><input type="text" id="m-vraag" value="${existing ? existing.vraagText : ''}">`;
    } else if (type === 'stelling') {
      form.innerHTML += `<label>Stellingtekst</label><input type="text" id="m-stelling" value="${existing ? existing.stellingText : ''}">`;
    } else if (type === 'fotoStelling') {
      form.innerHTML += `<label>Stellingtekst</label><input type="text" id="m-foto-stelling" value="${existing ? existing.stellingText : ''}">`;
      form.innerHTML += `<p style="color:#64748b; font-size:0.8rem; margin-top:5px;">De fotolijst is vast ingesteld (37 screenshots).</p>`;
    } else if (type === 'website') {
      form.innerHTML += `<label>Website-URL</label><input type="url" id="m-url" placeholder="https://..." value="${existing ? existing.url : ''}">`;
    } else if (type === 'youtube') {
      form.innerHTML += `<label>YouTube-URL (of video-ID)</label><input type="text" id="m-url" placeholder="https://www.youtube.com/watch?v=..." value="${existing ? existing.url : ''}">`;
    }
    document.getElementById('modal-overlay').style.display = 'flex';
  }

  function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

  function saveModal() {
    if (!isEditMode) return;
    const type = document.getElementById('m-type').value;
    let obj = { type: type, active: true, id: existingIdOrNew() };
    
    if (type === 'text') obj.text = document.getElementById('m-text').value;
    if (type === 'vraag') obj.vraagText = document.getElementById('m-vraag').value;
    if (type === 'stelling') obj.stellingText = document.getElementById('m-stelling').value;
    if (type === 'fotoStelling') {
      obj.stellingText = document.getElementById('m-foto-stelling').value;
      obj.fotos = SCREENSHOTS; // vast
    }
    if (type === 'website' || type === 'youtube') obj.url = document.getElementById('m-url').value;

    if (!contentData[currentTopicId]) contentData[currentTopicId] = [];
    
    if (modalMode === 'add') {
      contentData[currentTopicId].push(obj);
    } else {
      obj.active = contentData[currentTopicId][currentComponentIdx].active;
      contentData[currentTopicId][currentComponentIdx] = obj;
    }
    db.ref(`draft/content/${currentTopicId}`).set(contentData[currentTopicId]);
    closeModal();
  }

  function existingIdOrNew() {
    if (modalMode === 'edit' && contentData[currentTopicId][currentComponentIdx].id) {
      return contentData[currentTopicId][currentComponentIdx].id;
    }
    return 'c_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
  }

  function deleteComponent(topicId, idx) {
    if(!confirm("Weet je zeker dat je dit blok wilt wissen?")) return;
    contentData[topicId].splice(idx, 1);
    db.ref(`draft/content/${topicId}`).set(contentData[topicId]);
  }

  // ---------- HOOFDSTUKKEN/AVONDEN DYNAMISCH BEWERKEN ----------
  let editingTopicId = null;
  function openAddTopicModal() {
    editingTopicId = null;
    document.getElementById('topic-title-input').value = '';
    document.getElementById('topic-modal-title').textContent = "Nieuwe Avond Toevoegen";
    document.getElementById('topic-modal-overlay').style.display = 'flex';
  }
  function openEditTopicModal(id, currentTitle) {
    editingTopicId = id;
    document.getElementById('topic-title-input').value = currentTitle;
    document.getElementById('topic-modal-title').textContent = "Titel van Avond Aanpassen";
    document.getElementById('topic-modal-overlay').style.display = 'flex';
  }
  function closeTopicModal() { document.getElementById('topic-modal-overlay').style.display = 'none'; }
  
  function saveTopicModal() {
    const title = document.getElementById('topic-title-input').value.trim();
    if(!title) return;
    
    if (editingTopicId === null) {
      const newId = 'avond_' + Date.now();
      topicsList.push({ id: newId, title: title });
      contentData[newId] = [{ id: 't_' + Date.now(), type: 'text', text: 'Nieuw programmablok.', active: true }];
    } else {
      const topic = topicsList.find(t => t.id === editingTopicId);
      if(topic) topic.title = title;
    }
    
    db.ref('draft/topics').set(topicsList);
    db.ref('draft/content').set(contentData);
    closeTopicModal();
  }

  function deleteTopic(id) {
    if(!confirm("Weet je 100% zeker dat je deze volledige avond en alle bijbehorende tekst/vragen wilt verwijderen?")) return;
    topicsList = topicsList.filter(t => t.id !== id);
    if(contentData[id]) delete contentData[id];
    db.ref('draft/topics').set(topicsList);
    db.ref('draft/content').set(contentData);
  }

  // ---------- LIVE DEELNEMERS PUSH & CONTROLS ----------
  document.getElementById('publishBtn').addEventListener('click', function() {
    if (!confirm('Wil je alle geredigeerde teksten en avonden direct pushen naar de telefoons van de studenten?')) return;
    db.ref('draft').once('value').then(snap => {
      if(snap.val()) {
        db.ref('published').set(snap.val());
        alert('📤 Live! De studenten zien nu direct de nieuwste opzet op hun telefoon.');
      }
    });
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    if (!confirm('⚠️ Let op: Weet je zeker dat je alle data wilt terugzetten naar de 5 standaardavonden? Alle live antwoorden worden gewist.')) return;
    db.ref('interactie').remove();
    db.ref('fototoewijzing').remove();
    const def = getDefaultData();
    db.ref('draft').set(def);
    db.ref('published').set(def);
    alert('Systeem succesvol gereset naar de 5 basisavonden.');
  });

  // ---------- SETUP INITIALISATIE ----------
  document.addEventListener('DOMContentLoaded', initApp);
  function escapeHtml(text) { if (!text) return ''; const map = { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }; return text.replace(/[&<>"']/g, m => map[m]); }
</script>
</body>
</html>
