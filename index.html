  // ---------- RENDER ACCORDION ----------
  function renderAccordion() {
    const root = document.getElementById('accordion-root');
    root.innerHTML = '';
    topics.forEach(topic => {
      const item = document.createElement('div');
      item.className = 'accordion-item';

      const header = document.createElement('button');
      header.className = 'accordion-header';
      header.innerHTML = `${topic.title} <span class="arrow">▶</span>`;
      header.onclick = () => toggleAccordion(header, topic.id);

      const panel = document.createElement('div');
      panel.className = 'accordion-panel';
      panel.id = `panel-${topic.id}`;

      const compContainer = document.createElement('div');
      compContainer.className = 'component-container';
      compContainer.id = `components-${topic.id}`;
      panel.appendChild(compContainer);

      const addArea = document.createElement('div');
      addArea.className = 'add-component-area';
      addArea.innerHTML = `
        <select id="type-select-${topic.id}">
          ${componentTypes.map(t => `<option value="${t.value}">${t.label}</option>`).join('')}
        </select>
        <button onclick="openAddModal('${topic.id}')">➕ Toevoegen</button>
      `;
      panel.appendChild(addArea);

      item.appendChild(header);
      item.appendChild(panel);
      root.appendChild(item);
    });
    loadData();
  }

  // ---------- ACCORDION TOGGLE ----------
  function toggleAccordion(header, topicId) {
    const panel = document.getElementById(`panel-${topicId}`);
    const isOpen = panel.classList.contains('open');
    document.querySelectorAll('.accordion-panel').forEach(p => p.classList.remove('open'));
    document.querySelectorAll('.accordion-header').forEach(h => h.classList.remove('active'));
    if (!isOpen) {
      panel.classList.add('open');
      header.classList.add('active');
    }
  }

  // ---------- LOAD DATA FROM FIREBASE ----------
  function loadData() {
    db.ref('accordionData').on('value', (snapshot) => {
      const val = snapshot.val();
      if (val) {
        data = val;
        // Check if all topics exist, if not fill with defaults
        topics.forEach(t => {
          if (!data[t.id] || data[t.id].length === 0) {
            data[t.id] = getDefaultData()[t.id] || [];
          }
        });
      } else {
        data = getDefaultData();
        // Save defaults to Firebase
        db.ref('accordionData').set(data);
      }
      renderAllComponents();
      // Also load drawings, answers, gebedspunten
      loadAllDrawings();
      loadAllAnswers();
      loadAllGebedspunten();
    });
  }

  function renderAllComponents() {
    topics.forEach(topic => {
      const container = document.getElementById(`components-${topic.id}`);
      if (!container) return;
      const components = data[topic.id] || [];
      container.innerHTML = '';
      components.forEach((comp, index) => {
        const item = document.createElement('div');
        item.className = 'component-item' + (comp.active === false ? ' disabled' : '');
        const contentDiv = document.createElement('div');
        contentDiv.className = 'content';
        contentDiv.id = `content-${comp.id}`;
        // Render based on type
        renderComponentContent(contentDiv, comp, topic.id);
        item.appendChild(contentDiv);

        const actions = document.createElement('div');
        actions.className = 'actions';
        // Toggle button
        const toggleBtn = document.createElement('button');
        toggleBtn.className = 'toggle' + (comp.active !== false ? ' on' : '');
        toggleBtn.textContent = comp.active !== false ? 'Aan' : 'Uit';
        toggleBtn.onclick = () => toggleComponent(topic.id, index);
        actions.appendChild(toggleBtn);

        const editBtn = document.createElement('button');
        editBtn.innerHTML = '✎';
        editBtn.title = 'Bewerken';
        editBtn.onclick = () => openEditModal(topic.id, index);
        const delBtn = document.createElement('button');
        delBtn.innerHTML = '✕';
        delBtn.className = 'delete';
        delBtn.title = 'Verwijderen';
        delBtn.onclick = () => deleteComponent(topic.id, index);
        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        item.appendChild(actions);

        container.appendChild(item);
      });
    });
  }

  // ---------- RENDER COMPONENT CONTENT ----------
  function renderComponentContent(container, comp, topicId) {
    container.innerHTML = '';
    switch(comp.type) {
      case 'text':
        container.innerHTML = `<p style="margin:0;white-space:pre-wrap;">${escapeHtml(comp.text || '')}</p>`;
        break;
      case 'youtube':
        const videoId = comp.videoId || '';
        if (videoId) {
          container.innerHTML = `<iframe class="youtube-iframe" src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
        } else {
          container.innerHTML = `<p style="color:#888;">Geen video-ID ingevoerd. Bewerk dit component om een YouTube-video toe te voegen.</p>`;
        }
        break;
      case 'vraag':
        const vraagText = comp.vraagText || 'Stel een vraag...';
        container.innerHTML = `
          <div>
            <strong>${escapeHtml(vraagText)}</strong>
            <div class="vraag-input">
              <input type="text" id="antwoord-input-${comp.id}" placeholder="Uw antwoord...">
              <button onclick="verzendAntwoord('${topicId}','${comp.id}')">Verzend</button>
            </div>
            <div class="antwoord-lijst" id="antwoord-lijst-${comp.id}">
              <em>Antwoorden worden hier geladen...</em>
            </div>
          </div>
        `;
        listenToAnswers(topicId, comp.id);
        break;
      case 'tekenbord':
        container.innerHTML = `
          <div class="tekenbord-container">
            <canvas id="canvas-${comp.id}" width="600" height="400"></canvas>
            <div class="tekenknoppen">
              <button onclick="clearDrawing('${topicId}','${comp.id}')">🗑️ Wissen</button>
              <button onclick="saveDrawing('${topicId}','${comp.id}')">💾 Opslaan</button>
            </div>
          </div>
        `;
        setTimeout(() => initDrawing(topicId, comp.id), 100);
        break;
      case 'gebedspunten':
        container.innerHTML = `
          <div class="gebedspunten-container">
            <div class="input-row">
              <input type="text" id="gebedspunt-input-${comp.id}" placeholder="Voeg een gebedspunt toe...">
              <button onclick="voegGebedspuntToe('${topicId}','${comp.id}')">➕ Toevoegen</button>
            </div>
            <div class="gebedspunten-lijst" id="gebedspunten-lijst-${comp.id}">
              <em>Gebedspunten worden geladen...</em>
            </div>
          </div>
        `;
        listenToGebedspunten(topicId, comp.id);
        break;
      case 'bijbeltekst':
        const ref = comp.reference || '';
        const version = comp.version || '193'; // default NBV
        const embedUrl = ref ? `https://www.bible.com/embed/${version}/${encodeURIComponent(ref)}` : '';
        container.innerHTML = `
          <div class="bijbeltekst-container">
            <div class="input-row">
              <input type="text" id="bijbel-ref-${comp.id}" placeholder="Bijbelreferentie (bv. Johannes 3:16)" value="${escapeHtml(ref)}">
              <input type="text" id="bijbel-version-${comp.id}" placeholder="Versie (bv. 193 voor NBV)" value="${escapeHtml(version)}" style="max-width:100px;">
              <button onclick="updateBijbeltekst('${topicId}','${comp.id}')">Update</button>
            </div>
            ${embedUrl ? `<iframe src="${embedUrl}" allowfullscreen></iframe>` : '<p>Voer een Bijbelreferentie in en klik op Update.</p>'}
          </div>
        `;
        break;
      case 'checkbox':
        container.innerHTML = `<label><input type="checkbox" ${comp.checked ? 'checked' : ''} disabled> ${escapeHtml(comp.label || '')}</label>`;
        break;
      case 'button':
        container.innerHTML = `<button style="padding:6px 16px;border-radius:6px;border:1px solid #ccc;background:#f0f4fa;cursor:default;">${escapeHtml(comp.label || 'Knop')}</button>`;
        break;
      case 'input':
        container.innerHTML = `<input type="text" placeholder="${escapeHtml(comp.placeholder || '')}" value="${escapeHtml(comp.value || '')}" disabled style="padding:6px 10px;border:1px solid #ccc;border-radius:6px;width:100%;max-width:300px;">`;
        break;
      default:
        container.textContent = 'Onbekend type';
    }
  }

  // ---------- TOGGLE COMPONENT ----------
  function toggleComponent(topicId, index) {
    const comp = data[topicId][index];
    if (!comp) return;
    comp.active = comp.active !== false ? false : true;
    db.ref(`accordionData/${topicId}/${index}`).update({ active: comp.active });
  }

  // ---------- ANSWER FEED ----------
  function listenToAnswers(topicId, compId) {
    const ref = db.ref(`answers/${topicId}/${compId}`);
    ref.on('value', (snapshot) => {
      const answers = snapshot.val();
      const listDiv = document.getElementById(`antwoord-lijst-${compId}`);
      if (!listDiv) return;
      if (!answers) {
        listDiv.innerHTML = '<em>Nog geen antwoorden.</em>';
        return;
      }
      let html = '';
      const keys = Object.keys(answers).sort((a,b) => a - b);
      keys.forEach(key => {
        const entry = answers[key];
        html += `<div class="antwoord-item">${escapeHtml(entry.antwoord)} <span class="tijd">${new Date(entry.timestamp).toLocaleString()}</span></div>`;
      });
      listDiv.innerHTML = html;
    });
  }

  function verzendAntwoord(topicId, compId) {
    const input = document.getElementById(`antwoord-input-${compId}`);
    if (!input) return;
    const antwoord = input.value.trim();
    if (!antwoord) { alert('Voer een antwoord in.'); return; }
    const ref = db.ref(`answers/${topicId}/${compId}`).push();
    ref.set({
      antwoord: antwoord,
      timestamp: Date.now()
    });
    input.value = '';
  }

  // ---------- GEBEDSPUNTEN FEED ----------
  function listenToGebedspunten(topicId, compId) {
    const ref = db.ref(`gebedspunten/${topicId}/${compId}`);
    ref.on('value', (snapshot) => {
      const punten = snapshot.val();
      const listDiv = document.getElementById(`gebedspunten-lijst-${compId}`);
      if (!listDiv) return;
      if (!punten) {
        listDiv.innerHTML = '<em>Nog geen gebedspunten.</em>';
        return;
      }
      let html = '';
      const keys = Object.keys(punten).sort((a,b) => a - b);
      keys.forEach(key => {
        const entry = punten[key];
        html += `<div class="gebedspunt-item">${escapeHtml(entry.punt)} <span class="tijd">${new Date(entry.timestamp).toLocaleString()}</span></div>`;
      });
      listDiv.innerHTML = html;
    });
  }

  function voegGebedspuntToe(topicId, compId) {
    const input = document.getElementById(`gebedspunt-input-${compId}`);
    if (!input) return;
    const punt = input.value.trim();
    if (!punt) { alert('Voer een gebedspunt in.'); return; }
    const ref = db.ref(`gebedspunten/${topicId}/${compId}`).push();
    ref.set({
      punt: punt,
      timestamp: Date.now()
    });
    input.value = '';
  }

  function loadAllGebedspunten() {
    // wordt geladen via listeners
  }

  // ---------- BIJBELTEKST UPDATE ----------
  function updateBijbeltekst(topicId, compId) {
    const refInput = document.getElementById(`bijbel-ref-${compId}`);
    const versionInput = document.getElementById(`bijbel-version-${compId}`);
    if (!refInput || !versionInput) return;
    const ref = refInput.value.trim();
    const version = versionInput.value.trim() || '193';
    // Update component in database
    const comp = data[topicId].find(c => c.id === compId);
    if (comp) {
      comp.reference = ref;
      comp.version = version;
      db.ref(`accordionData/${topicId}`).set(data[topicId]); // update entire array (or find index)
    }
    // Re-render will happen via listener
  }

  // ---------- DIGIBORD (TEKENBORD) ----------
  let drawingState = {};

  function initDrawing(topicId, compId) {
    const canvas = document.getElementById(`canvas-${compId}`);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const key = `${topicId}-${compId}`;
    drawingState[key] = { canvas, ctx, isDrawing: false };

    db.ref(`drawings/${topicId}/${compId}`).once('value').then(snap => {
      const dataUrl = snap.val();
      if (dataUrl) {
        const img = new Image();
        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);
        };
        img.src = dataUrl;
      }
    });

    // Mouse events
    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (canvas.width / rect.width);
      const y = (e.clientY - rect.top) * (canvas.height / rect.height);
      ctx.beginPath();
      ctx.moveTo(x, y);
      drawingState[key].isDrawing = true;
    });
    canvas.addEventListener('mousemove', (e) => {
      if (!drawingState[key].isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (canvas.width / rect.width);
      const y = (e.clientY - rect.top) * (canvas.height / rect.height);
      ctx.lineTo(x, y);
      ctx.stroke();
    });
    canvas.addEventListener('mouseup', () => {
      drawingState[key].isDrawing = false;
      saveDrawing(topicId, compId);
    });
    canvas.addEventListener('mouseleave', () => {
      drawingState[key].isDrawing = false;
    });

    // Touch events
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      const x = (touch.clientX - rect.left) * (canvas.width / rect.width);
      const y = (touch.clientY - rect.top) * (canvas.height / rect.height);
      ctx.beginPath();
      ctx.moveTo(x, y);
      drawingState[key].isDrawing = true;
    });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (!drawingState[key].isDrawing) return;
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      const x = (touch.clientX - rect.left) * (canvas.width / rect.width);
      const y = (touch.clientY - rect.top) * (canvas.height / rect.height);
      ctx.lineTo(x, y);
      ctx.stroke();
    });
    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      drawingState[key].isDrawing = false;
      saveDrawing(topicId, compId);
    });
  }

  function saveDrawing(topicId, compId) {
    const key = `${topicId}-${compId}`;
    const state = drawingState[key];
    if (!state) return;
    const dataUrl = state.canvas.toDataURL('image/png');
    db.ref(`drawings/${topicId}/${compId}`).set(dataUrl);
  }

  function clearDrawing(topicId, compId) {
    const key = `${topicId}-${compId}`;
    const state = drawingState[key];
    if (!state) return;
    state.ctx.clearRect(0, 0, state.canvas.width, state.canvas.height);
    db.ref(`drawings/${topicId}/${compId}`).remove();
  }

  function loadAllDrawings() { /* done via init */ }

  // ---------- LOAD ALL ANSWERS ----------
  function loadAllAnswers() { /* done via listeners */ }

  // ---------- HELPER: ESCAPE HTML ----------
  function escapeHtml(text) {
    if (!text) return '';
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return text.replace(/[&<>"']/g, m => map[m]);
  }

  // ---------- MODAL FUNCTIONS ----------
  function openAddModal(topicId) {
    currentTopicId = topicId;
    currentComponentId = null;
    modalMode = 'add';
    const select = document.getElementById(`type-select-${topicId}`);
    const type = select.value;
    openModalForType(type, null);
  }

  function openEditModal(topicId, index) {
    currentTopicId = topicId;
    currentComponentId = index;
    modalMode = 'edit';
    const comp = data[topicId][index];
    if (!comp) return;
    openModalForType(comp.type, comp);
  }

  function openModalForType(type, existing) {
    const overlay = document.getElementById('modal-overlay');
    const title = document.getElementById('modal-title');
    const form = document.getElementById('modal-form');

    title.textContent = modalMode === 'add' ? `Voeg ${componentTypes.find(t=>t.value===type)?.label || type} toe` : 'Bewerk component';
    let html = `<input type="hidden" id="modal-type" value="${type}">`;

    switch(type) {
      case 'text':
        html += `<label>Tekstinhoud</label><textarea id="modal-text" rows="4">${existing ? existing.text || '' : ''}</textarea>`;
        break;
      case 'youtube':
        html += `<label>YouTube Video-ID</label><input id="modal-videoId" value="${existing ? existing.videoId || '' : ''}" placeholder="Bijv. dQw4w9WgXcQ">`;
        break;
      case 'vraag':
        html += `<label>Vraagtekst</label><textarea id="modal-vraagText" rows="2">${existing ? existing.vraagText || '' : ''}</textarea>`;
        break;
      case 'tekenbord':
        html += `<p>Het tekenbord heeft geen instellingen. Het wordt weergegeven als canvas.</p>`;
        break;
      case 'gebedspunten':
        html += `<p>Dit component toont een livefeed van gebedspunten. Geen extra instellingen.</p>`;
        break;
      case 'bijbeltekst':
        html += `<label>Bijbelreferentie (bv. Johannes 3:16)</label><input id="modal-reference" value="${existing ? existing.reference || '' : ''}">`;
        html += `<label>Versie (bv. 193 voor NBV)</label><input id="modal-version" value="${existing ? existing.version || '' : '193'}">`;
        break;
      case 'checkbox':
        html += `<label>Label</label><input id="modal-label" value="${existing ? existing.label || '' : ''}">`;
        html += `<label><input type="checkbox" id="modal-checked" ${existing && existing.checked ? 'checked' : ''}> Standaard aangevinkt</label>`;
        break;
      case 'button':
        html += `<label>Knoptekst</label><input id="modal-label" value="${existing ? existing.label || '' : 'Klik hier'}">`;
        break;
      case 'input':
        html += `<label>Placeholder</label><input id="modal-placeholder" value="${existing ? existing.placeholder || '' : ''}">`;
        html += `<label>Waarde</label><input id="modal-value" value="${existing ? existing.value || '' : ''}">`;
        break;
      default:
        html += `<p>Onbekend type</p>`;
    }
    // Option to set active status (standaard true)
    html += `<label><input type="checkbox" id="modal-active" ${existing && existing.active === false ? '' : 'checked'}> Component actief</label>`;

    form.innerHTML = html;
    overlay.style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('modal-overlay').style.display = 'none';
  }

  function saveModal() {
    const type = document.getElementById('modal-type').value;
    let newComp = { type };
    switch(type) {
      case 'text':
        newComp.text = document.getElementById('modal-text').value;
        break;
      case 'youtube':
        newComp.videoId = document.getElementById('modal-videoId').value;
        break;
      case 'vraag':
        newComp.vraagText = document.getElementById('modal-vraagText').value;
        break;
      case 'tekenbord':
        newComp.drawing = '';
        break;
      case 'gebedspunten':
        // no extra fields
        break;
      case 'bijbeltekst':
        newComp.reference = document.getElementById('modal-reference').value;
        newComp.version = document.getElementById('modal-version').value || '193';
        break;
      case 'checkbox':
        newComp.label = document.getElementById('modal-label').value;
        newComp.checked = document.getElementById('modal-checked').checked;
        break;
      case 'button':
        newComp.label = document.getElementById('modal-label').value;
        break;
      case 'input':
        newComp.placeholder = document.getElementById('modal-placeholder').value;
        newComp.value = document.getElementById('modal-value').value;
        break;
      default:
        newComp = { type };
    }
    // Active status
    newComp.active = document.getElementById('modal-active').checked;

    // Genereer uniek ID als nieuw
    if (!newComp.id) {
      newComp.id = 'comp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
    }

    const topicId = currentTopicId;
    const list = data[topicId] || [];

    if (modalMode === 'add') {
      list.push(newComp);
    } else {
      const idx = currentComponentId;
      if (idx !== null && idx < list.length) {
        newComp.id = list[idx].id;
        list[idx] = newComp;
      }
    }

    data[topicId] = list;
    db.ref('accordionData').set(data);
    closeModal();
  }

  // ---------- DELETE COMPONENT ----------
  function deleteComponent(topicId, index) {
    if (!confirm('Weet je zeker dat je dit component wilt verwijderen?')) return;
    const list = data[topicId] || [];
    const comp = list[index];
    if (comp) {
      // Verwijder bijbehorende data
      if (comp.type === 'vraag') {
        db.ref(`answers/${topicId}/${comp.id}`).remove();
      }
      if (comp.type === 'tekenbord') {
        db.ref(`drawings/${topicId}/${comp.id}`).remove();
      }
      if (comp.type === 'gebedspunten') {
        db.ref(`gebedspunten/${topicId}/${comp.id}`).remove();
      }
    }
    list.splice(index, 1);
    data[topicId] = list;
    db.ref('accordionData').set(data);
  }

  // ---------- RESET DATABASE ----------
  document.getElementById('resetBtn').addEventListener('click', function() {
    if (!confirm('Weet je zeker dat je ALLE gegevens wilt wissen? Dit verwijdert alle antwoorden, tekeningen, gebedspunten en aangepaste componenten. De standaardteksten worden hersteld.')) return;
    // Verwijder alle extra data
    db.ref('answers').remove();
    db.ref('drawings').remove();
    db.ref('gebedspunten').remove();
    // Reset accordionData naar defaults
    const defaultData = getDefaultData();
    db.ref('accordionData').set(defaultData);
  });

  // ---------- INIT ----------
  document.addEventListener('DOMContentLoaded', () => {
    renderAccordion();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });
</script>
